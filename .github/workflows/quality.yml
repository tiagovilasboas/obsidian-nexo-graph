name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/graph-engine.js
          node scripts/bundle.mjs --check
      - name: Run graph engine tests
        run: node --test tests/*.test.js
      - name: Check CSS accessibility and motion contract
        run: node scripts/check-css-contract.mjs
      - name: Validate manifest contract
        run: node scripts/check-manifest.mjs
      - name: Validate Obsidian API minimum version
        run: node scripts/check-api-compatibility.mjs

name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/graph-engine.js
          node scripts/bundle.mjs --check
      - name: Run graph engine tests
        run: node --test tests/*.test.js
      - name: Validate manifest contract
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          for (const key of ['id', 'name', 'version', 'minAppVersion', 'description']) {
            if (typeof manifest[key] !== 'string' || manifest[key].trim() === '') {
              throw new Error(`manifest.${key} must be a non-empty string`);
            }
          }
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            throw new Error('manifest.version must use x.y.z semver');
          }
          EOF
